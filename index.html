<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="facebook-domain-verification" content="njijewli1uv52d9bepvyxjx3ze7fxi" />
    <title>PopNPlay</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #ffffff; 
            color: #000000;
            display: flex;
            height: 100vh;
            justify-content: center; /* Keeps it centered horizontally */
            
            /* --- MOVED UP SECTION --- */
            align-items: flex-start; /* Aligns to the top instead of center */
            padding-top: 15vh; /* This pushes it 15% down from the top. Change this number to move it up or down. */
        }

        .contact-container {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 24px;
            padding: 20px;
        }

        .company-icon {
            width: 120px; 
            height: 120px;
            display: block;
        }

        .text-group {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .company-name {
            font-weight: 700;
            font-size: 24px;
            margin-bottom: 4px;
            letter-spacing: -0.5px;
        }

        .email-link {
            color: #000000;
            text-decoration: none;
            font-size: 16px;
            opacity: 0.8;
        }

        .email-link:hover {
            text-decoration: underline;
            opacity: 1;
        }

        .privacy-link {
            margin-top: 12px;
            display: block;
            color: #8e8e93;
            font-size: 12px;
            text-decoration: none;
        }

        .privacy-link:hover {
            color: #000;
        }
    </style>
</head>

<body>

<div class="contact-container">
    <img src="PopNPlay_Icon.png" alt="PopNPlay Icon" class="company-icon">

    <div class="text-group">
        <span class="company-name">PopNPlay</span>
        <a href="mailto:hello@popnplay.games" class="email-link">hello@popnplay.games</a>
        <a href="privacy.html" class="privacy-link">Privacy Policy</a>
    </div>
</div>

</body>
</html>
