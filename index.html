<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="facebook-domain-verification" content="njijewli1uv52d9bepvyxjx3ze7fxi" />
    <title>PopNPlay</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #ffffff; 
            color: #000000; /* Global text color to black */
            display: flex;
            height: 100vh;
            align-items: center;
            justify-content: center;
        }

        .contact-container {
            width: 100%;
            max-width: 256px; /* Matches your new 256px icon size */
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .company-icon {
            width: 100%;
            height: auto;
            max-width: 256px; 
            margin-bottom: 20px;
            display: block;
        }

        .company-name {
            font-weight: 700;
            font-size: 22px;
            display: block;
            margin-bottom: 4px;
            letter-spacing: -0.5px;
        }

        .email-link {
            color: #000000; /* Set email text to black */
            text-decoration: none;
            font-size: 16px;
            opacity: 0.85; /* Makes it slightly softer than the bold name */
        }

        .email-link:hover {
            text-decoration: underline;
            opacity: 1;
        }

        .privacy-link {
            margin-top: 40px;
            display: block;
            color: #8e8e93;
            font-size: 12px;
            text-decoration: none;
        }

        .privacy-link:hover {
            color: #000;
        }
    </style>
</head>

<body>

<div class="contact-container">
    <img src="PopNPlay_Icon.png" alt="PopNPlay Icon" class="company-icon">

    <span class="company-name">PopNPlay</span>
    
    <p>
        <a href="mailto:hello@popnplay.games" class="email-link">hello@popnplay.games</a>
    </p>

    <a href="privacy.html" class="privacy-link">Privacy Policy</a>
</div>

</body>
</html>
