<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>PopNPlay</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #ffffff; 
            color: #000000;
            display: flex;
            height: 100vh;
            justify-content: center;
            align-items: flex-start; 
            padding-top: 15vh; 
        }

        .contact-container {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 24px;
            padding: 20px;
        }

        .company-icon {
            width: 120px; 
            height: 120px;
            display: block;
        }

        .text-group {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .email-link {
            color: #000000;
            text-decoration: none;
            font-size: 18px; /* Slightly larger since the title is gone */
            font-weight: 500;
            opacity: 0.9;
        }

        .email-link:hover {
            text-decoration: underline;
            opacity: 1;
        }

        .privacy-link {
            margin-top: 8px;
            display: block;
            color: #8e8e93;
            font-size: 13px;
            text-decoration: none;
        }

        .privacy-link:hover {
            color: #000;
        }
    </style>
</head>

<body>

<div class="contact-container">
    <img src="PopNPlay_Icon.png" alt="PopNPlay Icon" class="company-icon">

    <div class="text-group">
        <a href="mailto:hello@popnplay.games" class="email-link">hello@popnplay.games</a>
        <a href="privacy.html" class="privacy-link">Privacy Policy</a>
    </div>
