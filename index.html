<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="facebook-domain-verification" content="njijewli1uv52d9bepvyxjx3ze7fxi" />
    <title>PopNPlay</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #ffffff; 
            color: #1a1a1a;
            display: flex;
            height: 100vh;
            align-items: center;
            justify-content: center;
            /* text-align: center; <-- REMOVED THIS LINE */
        }

        .contact-container {
            width: 100%; /* Take full width of parent */
            max-width: 512px; /* But don't exceed your logo width */
            padding: 20px;
            display: flex; /* Turn the container into a flex column */
            flex-direction: column;
            align-items: flex-start; /* Align all children to the left */
        }

        .company-icon {
            width: 100%; /* Scale up to the max-width (512px) */
            height: auto; /* Let height adjust automatically */
            max-width: 512px; /* Ensure it matches the container max */
            margin-bottom: 24px;
            /* border-radius: 20%; <-- REMOVED: This was cutting the logo */
            /* object-fit: cover; <-- REMOVED: This was distorting the logo */
        }

        .company-name {
            font-weight: 700;
            font-size: 24px; /* Made slightly larger */
            display: block;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
            /* Left alignment is inherited */
        }

        .email-link {
            color: #007aff;
            text-decoration: none;
            font-size: 16px;
            /* Left alignment is inherited */
        }

        .email-link:hover {
            text-decoration: underline;
        }

        .privacy-link {
            margin-top: 60px; /* Increased top margin for more separation */
            display: block;
            color: #8e8e93;
            font-size: 13px;
            text-decoration: none;
            /* Left alignment is inherited */
        }

        .privacy-link:hover {
            color: #444;
        }
    </style>
</head>

<body>

<div class="contact-container">
    <img src="PopNPlay_Icon.png" alt="PopNPlay Icon" class="company-icon">

    <span class="company-name">PopNPlay</span>
    
    <p>
        <a href="mailto:hello@popnplay.games" class="email-link">hello@popnplay.games</a>
    </p>

    <a href="privacy.html" class="privacy-link">Privacy Policy</a>
</div>

</body>
</html>
